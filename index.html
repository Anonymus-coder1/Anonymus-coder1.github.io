<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Tester</title>
    <style>
        /* Add your CSS styles here */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fc3f7;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #b0bec5;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        input[type="password"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px #4fc3f7;
        }
        
        .strength-meter {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        
        .strength-text {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }
        
        .requirements {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .requirements h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #4fc3f7;
            font-size: 14px;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #b0bec5;
        }
        
        .requirement.met {
            color: #81c784;
        }
        
        .requirement-icon {
            margin-right: 8px;
            font-size: 12px;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            line-height: 1.6;
        }
        
        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Strength Tester</h1>
        
        <div class="input-group">
            <label for="password">Enter Password</label>
            <input type="password" id="password" placeholder="Type your password here..." autocomplete="off">
            <div class="strength-meter">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
        </div>
        
        <div class="requirements">
            <h3>Requirements Checklist</h3>
            <div class="requirement" id="req-length">
                <span class="requirement-icon">○</span>
                <span>At least 12 characters</span>
            </div>
            <div class="requirement" id="req-uppercase">
                <span class="requirement-icon">○</span>
                <span>Contains uppercase letter</span>
            </div>
            <div class="requirement" id="req-lowercase">
                <span class="requirement-icon">○</span>
                <span>Contains lowercase letter</span>
            </div>
            <div class="requirement" id="req-number">
                <span class="requirement-icon">○</span>
                <span>Contains number</span>
            </div>
            <div class="requirement" id="req-special">
                <span class="requirement-icon">○</span>
                <span>Contains special character</span>
            </div>
            <div class="requirement" id="req-common">
                <span class="requirement-icon">○</span>
                <span>Not a common password</span>
            </div>
        </div>
        
        <div class="feedback" id="feedback">
            <div class="feedback-title">Analysis</div>
            <div id="feedbackContent">Enter a password to see its strength analysis.</div>
        </div>
    </div>

    <script>
        // Common passwords list (subset for demonstration)
        const commonPasswords = [
            'password', '123456', '12345678', 'qwerty', 'abc123', 
            'monkey', '1234567', 'letmein', 'trustno1', 'dragon',
            'baseball', 'iloveyou', 'master', 'sunshine', 'ashley',
            'bailey', 'passw0rd', 'shadow', '123123', '654321',
            'superman', 'qazwsx', 'michael', 'football', 'password1'
        ];

        // Character sets
        const charSets = {
            uppercase: /[A-Z]/,
            lowercase: /[a-z]/,
            numbers: /[0-9]/,
            special: /[^A-Za-z0-9]/
        };

        // DOM elements
        const passwordInput = document.getElementById('password');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const feedbackContent = document.getElementById('feedbackContent');

        // Requirements elements
        const reqLength = document.getElementById('req-length');
        const reqUppercase = document.getElementById('req-uppercase');
        const reqLowercase = document.getElementById('req-lowercase');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');
        const reqCommon = document.getElementById('req-common');

        // Update requirement indicator
        function updateRequirement(element, met) {
            const icon = element.querySelector('.requirement-icon');
            if (met) {
                element.classList.add('met');
                icon.textContent = '✓';
            } else {
                element.classList.remove('met');
                icon.textContent = '○';
            }
        }

        // Calculate password entropy
        function calculateEntropy(password) {
            let poolSize = 0;
            if (/[a-z]/.test(password)) poolSize += 26;
            if (/[A-Z]/.test(password)) poolSize += 26;
            if (/[0-9]/.test(password)) poolSize += 10;
            if (/[^A-Za-z0-9]/.test(password)) poolSize += 32;
            
            return password.length * Math.log2(poolSize || 1);
        }

        // Get strength color based on score
        function getStrengthColor(score) {
            if (score < 30) return { color: '#ff5252', text: 'Very Weak' };
            if (score < 50) return { color: '#ff9800', text: 'Weak' };
            if (score < 70) return { color: '#ffeb3b', text: 'Fair' };
            if (score < 90) return { color: '#8bc34a', text: 'Strong' };
            return { color: '#4caf50', text: 'Very Strong' };
        }

        // Generate feedback based on analysis
        function generateFeedback(password, score, requirements) {
            let feedback = [];
            
            if (password.length < 12) {
                feedback.push("Your password is too short. Aim for at least 12 characters.");
            }
            
            if (!requirements.uppercase) {
                feedback.push("Add uppercase letters to increase complexity.");
            }
            
            if (!requirements.lowercase) {
                feedback.push("Add lowercase letters for better mix.");
            }
            
            if (!requirements.numbers) {
                feedback.push("Include numbers to strengthen the password.");
            }
            
            if (!requirements.special) {
                feedback.push("Add special characters like !@#$%^&* for maximum security.");
            }
            
            if (requirements.common) {
                feedback.push("This is a commonly used password. Please choose a more unique one.");
            }
            
            if (feedback.length === 0) {
                feedback.push("Excellent password! It meets all recommended criteria.");
                if (score > 90) {
                    feedback.push("This password would take centuries to crack with current technology.");
                }
            }
            
            return feedback.join(' ');
        }

        // Main password analyzer function
        function analyzePassword() {
            const password = passwordInput.value;
            
            if (password.length === 0) {
                strengthFill.style.width = '0%';
                strengthText.textContent = '';
                feedbackContent.textContent = 'Enter a password to see its strength analysis.';
                
                // Reset all requirements
                updateRequirement(reqLength, false);
                updateRequirement(reqUppercase, false);
                updateRequirement(reqLowercase, false);
                updateRequirement(reqNumber, false);
                updateRequirement(reqSpecial, false);
                updateRequirement(reqCommon, false);
                
                return;
            }
            
            // Check requirements
            const requirements = {
                length: password.length >= 12,
                uppercase: charSets.uppercase.test(password),
                lowercase: charSets.lowercase.test(password),
                numbers: charSets.numbers.test(password),
                special: charSets.special.test(password),
                common: commonPasswords.includes(password.toLowerCase())
            };
            
            // Update requirement indicators
            updateRequirement(reqLength, requirements.length);
            updateRequirement(reqUppercase, requirements.uppercase);
            updateRequirement(reqLowercase, requirements.lowercase);
            updateRequirement(reqNumber, requirements.numbers);
            updateRequirement(reqSpecial, requirements.special);
            updateRequirement(reqCommon, !requirements.common);
            
            // Calculate score
            let score = 0;
            
            // Length contributes 40% of the score
            if (password.length >= 12) score += 40;
            else if (password.length >= 8) score += 20;
            else if (password.length >= 6) score += 10;
            
            // Character types contribute 30% of the score
            if (requirements.uppercase) score += 7.5;
            if (requirements.lowercase) score += 7.5;
            if (requirements.numbers) score += 7.5;
            if (requirements.special) score += 7.5;
            
            // Entropy contributes 30% of the score
            const entropy = calculateEntropy(password);
            const entropyScore = Math.min(30, (entropy / 100) * 30);
            score += entropyScore;
            
            // Cap score at 100
            score = Math.min(100, Math.max(0, score));
            
            // Update visual indicators
            const strengthInfo = getStrengthColor(score);
            strengthFill.style.width = score + '%';
            strengthFill.style.backgroundColor = strengthInfo.color;
            strengthText.textContent = strengthInfo.text;
            strengthText.style.color = strengthInfo.color;
            
            // Generate feedback
            const feedback = generateFeedback(password, score, requirements);
            feedbackContent.textContent = feedback;
        }

        // Event listeners
        passwordInput.addEventListener('input', analyzePassword);
        passwordInput.addEventListener('keyup', analyzePassword);
        
        // Initial analysis
        analyzePassword();
    </script>
</body>
</html>
